name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Unit test (SSE parser + loop agen)
        run: ./gradlew testReleaseUnitTest --no-daemon

      - name: Build APK (release minified ±3.5MB + debug)
        run: ./gradlew assembleRelease assembleDebug --no-daemon

      - name: Rename artifacts
        run: |
          cp app/build/outputs/apk/release/app-release.apk ThorAgentMobile-v0.5.0-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk ThorAgentMobile-v0.5.0-debug.apk

      - name: Upload APK release
        uses: actions/upload-artifact@v4
        with:
          name: ThorAgentMobile-v0.5.0-release
          path: ThorAgentMobile-v0.5.0-release.apk

      - name: Upload APK debug
        uses: actions/upload-artifact@v4
        with:
          name: ThorAgentMobile-v0.5.0-debug
          path: ThorAgentMobile-v0.5.0-debug.apk
